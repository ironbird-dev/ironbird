name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 is the floor in every package's `engines`; 26 is the line the maintainers develop on. They ship
        # different WebSocket implementations (undici 6 and undici 8) whose observable behavior differs: on 22 a
        # refused connect fires `error` with no `close`, which hid a bridge reconnect bug until CI ran it.
        node: [22, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
  # Branch protection requires a status named `check`. The matrix reports `test (node 22)` and `test (node 26)`,
  # so this job carries the required name and passes only when every matrix leg passed.
  check:
    if: always()
    needs: test
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.test.result }}" = "success"
